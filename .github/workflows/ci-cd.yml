name: Local Docker CI/CD

# Пайплайн запускается при каждом пуше в ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    # Указываем, что запускать нужно именно на вашем домашнем ПК
    runs-on: [self-hosted, Windows, local-pc]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t my-local-app:latest .

    - name: Deploy Container Locally
      run: |
        # Останавливаем и удаляем старый контейнер, если он уже запущен
        if (docker ps -a -q -f name=my-running-app) {
            docker stop my-running-app
            docker rm my-running-app
        }
        # Запускаем новый контейнер на порту 3000
        docker run -d --name my-running-app -p 3000:3000 my-local-app:latest
